<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f5c57"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<title>Verse Reflections</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ea;--card:#fbfaf6;--ink:#1d2b2a;--mute:#5d6b69;--line:#d6d9d2;--accent:#1f5c57;--accent-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a19;--card:#172423;--ink:#e6ece9;--mute:#97a8a4;--line:#2a3b39;--accent:#6fc2b8;--accent-ink:#0b1514}}
:root[data-theme="dark"]{--bg:#101a19;--card:#172423;--ink:#e6ece9;--mute:#97a8a4;--line:#2a3b39;--accent:#6fc2b8;--accent-ink:#0b1514}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Newsreader',Georgia,'Noto Nastaliq Urdu',serif;font-size:18px;line-height:1.6}
main{max-width:680px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:2rem;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
label{display:block;font-size:.95rem;color:var(--mute);margin:14px 0 4px}
label small{display:block;font-size:.85rem;opacity:.85}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:84px}
.ar{direction:rtl;font-family:'Amiri','Traditional Arabic',serif;font-size:1.6rem;line-height:2;text-align:right}
.row{display:flex;gap:10px}.row>div{flex:1}.row>div.n{flex:0 0 90px}
button{font:inherit;cursor:pointer;border-radius:6px;padding:9px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
h2{font-size:1.25rem;margin:30px 0 12px}
.entry .ref{font-weight:600}
.entry .date{color:var(--mute);font-size:.9rem}
.entry .v{direction:rtl;font-family:'Amiri',serif;font-size:1.5rem;line-height:2;margin:8px 0}
.entry .t{font-style:italic;color:var(--mute)}
.entry h3{font-size:.95rem;color:var(--accent);margin:12px 0 2px}
.entry p{margin:0;white-space:pre-wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:.85rem;padding:2px 10px;border:1px solid var(--line);border-radius:99px;color:var(--accent);background:transparent;cursor:pointer}
a.lookup{display:inline-block;margin-top:8px;font-size:.95rem;color:var(--accent)}
a.lookup[hidden]{display:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#lang{padding:5px 14px;font-size:.95rem;flex:none}
:root[lang="ur"] body{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Noto Naskh Arabic',serif;font-size:16px;line-height:2.1}
:root[lang="ur"] h1{line-height:1.9}
.tb{display:flex;flex-direction:column;gap:6px;align-items:stretch}
#rtb{padding:5px 12px;font-size:.9rem}
.hint{margin:-14px 0 18px;color:var(--mute);font-size:.9rem}
details summary{cursor:pointer;font-weight:600}
.kp{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px;direction:rtl}
.kp button{padding:4px 0;font-family:'Amiri',serif;font-size:1.4rem;background:transparent;color:var(--ink);border-color:var(--line)}
.art{stroke:currentColor;fill:none;stroke-width:1.2;color:var(--accent)}
.bgart{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.07;pointer-events:none}
main{position:relative;z-index:1}
.band{height:84px;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px;background:var(--card)}
.band svg.art{width:100%;height:100%;display:block;opacity:.9}
.orn{display:flex;align-items:center;gap:12px;margin-top:28px;color:var(--accent)}
.orn span{flex:1;height:1px;background:var(--line)}
.orn svg{width:26px;height:26px;stroke-width:2}
.orn+h2{margin-top:12px}
.ctx{border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:6px;padding:10px 14px;margin-top:12px;background:var(--bg);font-size:.95rem}
.ctx h3{margin:0 0 4px;font-size:1rem;color:var(--accent)}
.ctx p{margin:6px 0 0}.ctx .n{color:var(--mute);font-size:.85rem}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.empty{color:var(--mute);text-align:center;padding:20px}
</style>
</head>
<body>
<svg class="art bgart" aria-hidden="true"><defs>
<g id="st"><polygon points="-20,-20 20,-20 20,20 -20,20"/><polygon points="28.28,0 0,28.28 -28.28,0 0,-28.28"/></g>
<pattern id="gp" width="80" height="80" patternUnits="userSpaceOnUse">
<use href="#st" x="40" y="40"/><use href="#st" x="0" y="0"/><use href="#st" x="80" y="0"/><use href="#st" x="0" y="80"/><use href="#st" x="80" y="80"/>
<circle cx="40" cy="0" r="3"/><circle cx="0" cy="40" r="3"/><circle cx="80" cy="40" r="3"/><circle cx="40" cy="80" r="3"/>
</pattern></defs><rect width="100%" height="100%" fill="url(#gp)"/></svg>
<main>
<div class="band"><svg class="art" aria-hidden="true"><rect width="100%" height="100%" fill="url(#gp)"/>
<svg x="50%" y="50%" overflow="visible"><circle r="34" style="fill:var(--card)"/><circle r="34"/><use href="#st" transform="scale(1.05)"/><circle r="5" style="fill:var(--accent)"/></svg></svg></div>
<div class="top"><h1 id="h1">Verse Reflections</h1><div class="tb"><button class="ghost" id="lang" aria-label="Language"></button><button class="ghost" id="rtb"></button></div></div>
<p class="sub" id="sub">Choose a verse, then spend time with its language.</p>

<p class="hint" id="hint"></p>
<div class="card" id="formCard">
<div class="row">
<div><label for="surah">Surah</label><input id="surah" list="sl" placeholder="Name or number" autocomplete="off"><datalist id="sl"></datalist></div>
<div class="n"><label for="ayah">Ayah</label><input id="ayah" placeholder="3"></div>
</div>
<a id="qlink" class="lookup" href="#" target="_blank" rel="noopener" hidden>Open this verse on Quran.com to copy the text</a>
<div class="ctx" id="ctx" hidden></div>
<label for="tsel"></label><select id="tsel"></select><p class="hint" id="fst" style="margin:6px 0 0"></p>
<label for="pz"></label><textarea id="pz" rows="2" autocomplete="off" style="min-height:52px"></textarea>
<label for="arabic">Verse in Arabic</label>
<textarea id="arabic" class="ar" lang="ar" rows="2"></textarea>
<label for="trans">Translation <small>Optional. Paste from a source you trust.</small></label>
<textarea id="trans" rows="2"></textarea>

<label for="tags">Tags <small>Optional, separated by commas. Example: mercy, hope, patience</small></label>
<input id="tags">
<label for="words">Words and roots <small>Which words stand out? What are their roots and other uses in the Quran?</small></label>
<textarea id="words"></textarea>
<label for="struct">Structure and grammar <small>Word order, verb forms, what is emphasized or left unsaid.</small></label>
<textarea id="struct"></textarea>
<label for="image">Imagery and tone <small>Metaphors, sound, rhythm, the feeling the verse creates.</small></label>
<textarea id="image"></textarea>
<label for="mine">My reflection <small>What does this mean to you today?</small></label>
<textarea id="mine"></textarea>

<div class="actions">
<button id="save">Save reflection</button>
<button class="ghost" id="clear">Clear</button>
</div>
</div>

<details class="card" id="fix"><summary id="fxs"></summary>
<p class="hint" id="fxh" style="margin:10px 0"></p>
<label id="fxl1" for="fxr"></label><input id="fxr" autocomplete="off" autocapitalize="none">
<label id="fxl2" for="fxu"></label><input id="fxu" class="ar" inputmode="none" lang="ur">
<div class="kp" id="kp"></div>
<div class="actions"><button id="fxsave"></button><button class="ghost" id="fxbk">⌫</button></div>
<div class="chips" id="cw"></div></details>
<div class="orn" aria-hidden="true"><span></span><svg class="art" viewBox="-16 -16 32 32"><use href="#st" transform="scale(.5)"/></svg><span></span></div>
<h2 id="h2">Past reflections</h2>
<input id="q" type="search" placeholder="Search by surah, word, tag or note" style="margin-bottom:14px">
<div id="list"></div>
<div class="actions"><button class="ghost" id="exb"></button><button class="ghost" id="imb"></button><input type="file" id="imf" accept="application/json,.json" hidden></div>
</main>

  if(!n||!/^\d+$/.test(a)||editing){setSt('');return}
  const id=++fT;setSt('fl');
  try{const j=await api('/verses/by_key/'+n+':'+a+'?translations='+($('tsel').value||131)+'&fields=text_uthmani');
    if(id!==fT)return;const v=j.verse||j;
    $('arabic').value=v.text_uthmani||'';
    const tr=(v.translations&&v.translations[0]&&v.translations[0].text)||'';
    $('trans').value=tr.replace(/<sup[\s\S]*?<\/sup>/g,'').replace(/<[^>]+>/g,'').trim();
    setSt('fok')}catch(e){if(id===fT)setSt('ferr')}}
async function loadTr(){
  try{const j=await api('/resources/translations');
    const L=(j.translations||[]).filter(x=>/^(english|urdu)$/i.test(x.language_name||''));
    const g=l=>L.filter(x=>x.language_name.toLowerCase()===l).map(x=>'<option value="'+x.id+'">'+esc(x.author_name||x.name)+'</option>').join('');
    $('tsel').innerHTML='<optgroup label="English">'+g('english')+'</optgroup><optgroup label="اردو">'+g('urdu')+'</optgroup>';
    let sv='';try{sv=localStorage.getItem('verse-tid')||''}catch(e){}
    const d=sv||'131';if([...$('tsel').options].some(o=>o.value===d))$('tsel').value=d}
  catch(e){$('tsel').innerHTML='<option value="131">Mustafa Khattab, The Clear Quran</option>'}}
$('tsel').onchange=()=>{try{localStorage.setItem('verse-tid',$('tsel').value)}catch(e){}fetchVerse()};
loadTr();
$('exb').onclick=()=>{const b=new Blob([JSON.stringify({v:1,entries,words:CW})],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='verse-reflections-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('imb').onclick=()=>$('imf').click();
$('imf').onchange=async()=>{const f=$('imf').files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(!Array.isArray(d.entries))throw 0;
    const have=new Set(entries.map(e=>e.id));
    d.entries.filter(e=>e&&e.id&&!have.has(e.id)).forEach(e=>entries.push(e));
    entries.sort((x,y)=>y.id-x.id);
    Object.assign(CW,d.words||{});try{localStorage.setItem('verse-words',JSON.stringify(CW))}catch(e){}
    persist();render();renderCW();alert(X().imok)}catch(e){alert(X().imerr)}
  $('imf').value=''};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');

$('rtb').onclick=()=>{rt=!rt;try{localStorage.setItem('verse-rt',rt?'1':'0')}catch(e){}apply()};
load();apply();render();
</script>
</body>
